name: supervisormobile
description: "supervisor mobile part"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+1

environment:
  sdk: '>=3.4.4 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  intl: ^0.19.0
  flutter_native_splash: ^2.4.1
  flutter_dotenv: ^5.0.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  smooth_page_indicator: ^1.2.0+3
  get: ^4.6.6
  iconsax: ^0.0.8
  table_calendar: ^3.0.9
  grouped_list: ^6.0.0
  simple_circular_progress_bar: ^1.0.2
  animated_custom_dropdown: ^3.1.1
  image_picker: ^1.1.2
  flutter_awesome_bottom_sheet: ^0.0.2
  sticky_float_button: ^0.1.0
  flutter_localizations:
    sdk: flutter
  http_parser: ^4.0.2
  mime: ^1.0.5
  flutter_image_slideshow: ^0.1.6
  easy_image_viewer: ^1.5.1
  camera: ^0.11.0+2
  image_editor_plus: ^1.0.6
  path_provider: ^2.1.4
  image_gallery_saver: ^2.0.3
  fl_chart: ^0.68.0
  slideable: ^0.0.2
  awesome_snackbar_content: ^0.1.3
  animations: ^2.0.11
  liquid_pull_to_refresh: ^3.0.1
  # Raised from ^4.2.1 for AGP 8 compatibility (the old native module has no
  # `namespace`, which AGP 8 requires) — see android/settings.gradle. Users on the
  # old version's Android encryption scheme get logged out once and re-authenticate;
  # accepted as a one-time cost of the AGP upgrade needed for messenger voice notes.
  flutter_secure_storage: ^9.2.4
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.3.3
  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  dio: ^5.3.2
  # Raised from ^8.2.1 for AGP 8 compatibility (geolocator_android 3.2.1, resolved by
  # the old constraint, has no `namespace`; ^13.0.0 resolves to 4.6.x, which does).
  geolocator: ^13.0.0
  url_launcher: ^6.2.5
  open_file: ^3.5.1
  package_info_plus: ^8.0.0
  flutter_image_compress: ^2.3.0
  # Smart Messenger (Phase G) — realtime + offline outbound queue
  # (`flutter_slidable` powers the inbox swipe actions — not the unrelated, unused
  # `slideable` entry further down.)
  flutter_slidable: ^3.1.0
  sqflite: ^2.3.3
  path: ^1.9.0
  # Voice notes: record (record_android requires minSdk 23 — see android/app/build.gradle)
  # and play back (just_audio) recorded clips.
  record: ^5.2.1
  just_audio: ^0.9.40
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  signalr_netcore: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

# record 5.2.1 constrains record_linux to '>=0.5.0 <1.0.0', which pub resolves to
# 0.7.2 — a version that predates record_platform_interface 1.3.0's startStream
# method and fails to compile against it. This app never ships to Linux desktop,
# but Flutter still resolves/compiles every platform implementation record depends
# on, so the mismatch breaks the build regardless. Overriding to a version that
# actually implements the current platform interface unblocks that; remove this
# once `record` bumps its own record_linux constraint past the fix.
dependency_overrides:
  record_linux: ^1.1.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/logos/testLogo.png"
  min_sdk_android: 23 # matches android/app/build.gradle's minSdk (raised for the record plugin)


flutter:


  uses-material-design: true
  assets:
    - lib/assets/on_boarding_images/
    - lib/assets/logos/testLogo.png
    - lib/assets/fonts/Poppins/
    - config.env

  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: lib/assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

  generate: true


