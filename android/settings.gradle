pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Raised from 7.3.0/1.8.22 (Gradle bumped to match, see gradle-wrapper.properties):
    // record_android's compiled Kotlin sealed classes fail to dex under the old AGP/D8.
    // AGP 8.1.x / Gradle 8.0.2 is the newest combination Flutter 3.22.3's own tooling
    // was validated against (see flutter_tools/lib/src/android/gradle_utils.dart).
    id "com.android.application" version "8.1.4" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
}

include ":app"
